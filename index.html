  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       WELCOME LANDING PAGE - MINIMAL WORLD GLOBE
       Asli Ozteker - GMT 458 Web GIS
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080d1a;
      font-family: 'Inter', 'Open Sans', -apple-system, sans-serif;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 3D Canvas */
    #globeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Minimal Overlay */
    .welcome-overlay {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1.5rem;
      pointer-events: none;
    }

    /* Top Badge */
    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(14, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.45rem 1.25rem;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1.2s ease-out;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Center: WELCOME */
    .center-text-box {
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      transform: translateY(-5px);
    }

    .welcome-title {
      font-size: clamp(1.8rem, 3.8vw, 2.9rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      margin-bottom: 0;
      animation: welcomeGlow 3.5s ease-in-out infinite alternate;
    }

    @keyframes welcomeGlow {
      from { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.2)); }
      to { filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.45)); }
    }

    /* Bottom: Faint click text */
    .bottom-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 1.8s ease-out;
    }

    .faint-click {
      font-family: 'Inter', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.32);
      animation: faintBreathing 2.6s ease-in-out infinite;
    }

    .mouse-icon {
      width: 18px;
      height: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      position: relative;
      margin-top: 2px;
    }

    .mouse-wheel {
      width: 3px;
      height: 6px;
      background-color: rgba(56, 189, 248, 0.7);
      border-radius: 2px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      animation: scrollWheel 2s infinite;
    }

    @keyframes scrollWheel {
      0% { top: 5px; opacity: 1; }
      100% { top: 15px; opacity: 0; }
    }

    @keyframes faintBreathing {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 0.7; transform: translateY(-3px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

        #warpOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(8, 13, 26, 0.98) 75%);
      backdrop-filter: blur(0px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.55s ease;
    }

<body>

  <!-- Minimal 3D Globe Canvas -->
  <canvas id="globeCanvas"></canvas>

  <div class="welcome-overlay" id="welcomeOverlay">
    <div class="top-badge">
      <div class="pulse-dot"></div>
      <span>Asli Ozteker &bull; GMT 458 Web GIS</span>
    </div>

    <div class="center-text-box">
      <h1 class="welcome-title">WELCOME</h1>
    </div>

    <div class="bottom-prompt">
      <div class="faint-click">c l i c k</div>
      <div class="mouse-icon">
        <div class="mouse-wheel"></div>
      </div>
    </div>
  </div>

  <div id="warpOverlay"></div>

  <!-- Pure, Simple and Elegant 3D Globe Script -->
  <script>
    (function () {
      const canvas = document.getElementById('globeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      let radius = Math.min(width, height) * 0.32;
      let rotationY = 0.8;
      let rotationX = 0.32;
      const autoSpeed = 0.0035; // Smooth rotation speed

      let targetRotX = rotationX;
      let isWarping = false;
      let warpScale = 1.0;
      let warpOpacity = 1.0;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        radius = Math.min(width, height) * 0.32;
      });

      window.addEventListener('mousemove', (e) => {
        const normY = (e.clientY / height - 0.5) * 2;
        targetRotX = 0.32 + normY * 0.2;
      });

      // 3D Spherical Projection
      function project(latDeg, lonDeg, r) {
        const lat = (latDeg * Math.PI) / 180;
        const lon = (lonDeg * Math.PI) / 180 + rotationY;

        const x = r * Math.cos(lat) * Math.sin(lon);
        const y = -r * Math.sin(lat);
        const z = r * Math.cos(lat) * Math.cos(lon);

        const cosX = Math.cos(rotationX);
        const sinX = Math.sin(rotationX);

        const y2 = y * cosX - z * sinX;
        const z2 = y * sinX + z * cosX;

        return {
          x: width / 2 + x,
          y: height / 2 + y2,
          z: z2,
          visible: z2 > 0
        };
      }

      // Minimalist graticule lines
      function drawGraticule(r) {
        ctx.lineWidth = 0.7;

        // Parallels (Latitudes)
        const latitudes = [-60, -30, 0, 30, 60];
        for (let i = 0; i < latitudes.length; i++) {
          const lat = latitudes[i];
          ctx.beginPath();
          let first = true;
          for (let lon = 0; lon <= 360; lon += 6) {
            const p = project(lat, lon, r);
            if (p.visible) {
              if (first) { ctx.moveTo(p.x, p.y); first = false; }
              else { ctx.lineTo(p.x, p.y); }
            } else {
              first = true;
            }
          }
          ctx.strokeStyle = lat === 0 ? 'rgba(56, 189, 248, 0.38)' : 'rgba(255, 255, 255, 0.08)';
          ctx.stroke();
        }

        // Meridians (Longitudes)
        for (let lon = 0; lon < 360; lon += 30) {
          ctx.beginPath();
          let first = true;
          for (let lat = -85; lat <= 85; lat += 5) {
            const p = project(lat, lon, r);
            if (p.visible) {
              if (first) { ctx.moveTo(p.x, p.y); first = false; }
              else { ctx.lineTo(p.x, p.y); }
            } else {
              first = true;
            }
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
          ctx.stroke();
        }
      }

      // Ankara / Hacettepe Marker (39.87 deg N, 32.73 deg E)
      const ankaraCoord = { lat: 39.8657, lon: 32.7339 };
      let pulseCounter = 0;

      function animate() {
        ctx.clearRect(0, 0, width, height);

        // Dark space radial background
        const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.6);
        bgGrad.addColorStop(0, 'rgba(14, 23, 42, 0.5)');
        bgGrad.addColorStop(1, 'rgba(8, 13, 26, 0.98)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        if (!isWarping) {
          rotationY += autoSpeed;
          rotationX += (targetRotX - rotationX) * 0.05;
        } else {
          warpScale += (9.0 - warpScale) * 0.07;
          warpOpacity -= 0.045;
          rotationY += autoSpeed * 3;
          if (warpOpacity <= 0) {
            window.location.href = 'home.html';
            return;
          }
        }

        const curRadius = radius * warpScale;
        ctx.globalAlpha = Math.max(0, warpOpacity);

        // Outer atmospheric halo
        const glow = ctx.createRadialGradient(width / 2, height / 2, curRadius * 0.92, width / 2, height / 2, curRadius * 1.22);
        glow.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
        glow.addColorStop(0.5, 'rgba(2, 132, 199, 0.05)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, curRadius * 1.22, 0, Math.PI * 2);
        ctx.fill();

        // Sphere gradient body
        const sphereGrad = ctx.createRadialGradient(
          width / 2 - curRadius * 0.35, height / 2 - curRadius * 0.35, curRadius * 0.05,
          width / 2, height / 2, curRadius
        );
        sphereGrad.addColorStop(0, 'rgba(15, 28, 55, 0.85)');
        sphereGrad.addColorStop(0.7, 'rgba(10, 18, 35, 0.92)');
        sphereGrad.addColorStop(1, 'rgba(6, 11, 22, 0.98)');
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, curRadius, 0, Math.PI * 2);
        ctx.fillStyle = sphereGrad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.32)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // Graticule grid
        drawGraticule(curRadius);

        // Ankara / Hacettepe Marker
        pulseCounter += 0.045;
        const ank = project(ankaraCoord.lat, ankaraCoord.lon, curRadius);
        if (ank.visible) {
          const waveR = 8 + (pulseCounter % 2) * 12;
          const waveA = Math.max(0, 1 - (pulseCounter % 2));

          // Pulse wave ring
          ctx.beginPath();
          ctx.arc(ank.x, ank.y, waveR, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(16, 185, 129, ' + waveA + ')';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Center green dot
          ctx.beginPath();
          ctx.arc(ank.x, ank.y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Label text
          ctx.font = '600 11px Inter, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('Ankara - Hacettepe', ank.x + 10, ank.y - 4);
        }

        ctx.globalAlpha = 1.0;
        requestAnimationFrame(animate);
      }

      function enter() {
        if (isWarping) return;
        isWarping = true;
        const ov = document.getElementById('welcomeOverlay');
        if (ov) {
          ov.style.transition = 'opacity 0.45s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
          ov.style.opacity = '0';
          ov.style.transform = 'scale(0.95)';
        }
        const flash = document.getElementById('warpOverlay');
        if (flash) {
          flash.style.opacity = '1';
          flash.style.backdropFilter = 'blur(6px)';
        }
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 520);
      }

      document.addEventListener('click', enter);
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') enter();
      });

      animate();
    })();
  </script>
</body>
